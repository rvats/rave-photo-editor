name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # the last step publishes the build outputs to the ci-builds branch

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode the upload key
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No upload key in the repository secrets, so the release bundle is unsigned."
          fi

      - name: Build the release bundle and test APKs
        env:
          VERSION_CODE: ${{ github.run_number }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace bundleRelease assembleRelease assembleDebug 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Describe the build
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          APK="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          "$BT/aapt2" dump badging "$APK" > "$RUNNER_TEMP/badging.txt"
          head -5 "$RUNNER_TEMP/badging.txt"
          grep -E "uses-permission" "$RUNNER_TEMP/badging.txt" || echo "no permissions"
          MANIFEST="$(find app/build/intermediates -name AndroidManifest.xml -path '*merged_manifest*' -path '*elease*' | head -1)"
          [ -n "$MANIFEST" ] && cp "$MANIFEST" "$RUNNER_TEMP/merged-release-manifest.xml"
          ls -l app/build/outputs/bundle/release app/build/outputs/apk/release app/build/outputs/apk/debug | tee "$RUNNER_TEMP/outputs.txt"

      - name: Upload the build outputs
        uses: actions/upload-artifact@v7
        with:
          name: rave-photo-editor-build-${{ github.run_number }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Enable KVM for the emulator
        continue-on-error: true
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test and screenshots on an emulator
        continue-on-error: true
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/screenshots.sh "$RUNNER_TEMP/screens"

      - name: Publish the outputs to the ci-builds branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          OUT="$RUNNER_TEMP/ci-out"
          mkdir -p "$OUT"
          for f in build.log badging.txt merged-release-manifest.xml outputs.txt; do
            [ -f "$RUNNER_TEMP/$f" ] && cp "$RUNNER_TEMP/$f" "$OUT/"
          done
          cp app/build/outputs/bundle/release/*.aab "$OUT/" 2>/dev/null || true
          cp app/build/outputs/apk/debug/*.apk "$OUT/" 2>/dev/null || true
          cp app/build/outputs/mapping/release/mapping.txt "$OUT/" 2>/dev/null || true
          [ -d "$RUNNER_TEMP/screens" ] && cp -r "$RUNNER_TEMP/screens" "$OUT/"
          printf 'Build %s of %s\nStatus: %s\n' "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" "$JOB_STATUS" > "$OUT/README.md"
          cd "$OUT"
          git init -q -b ci-builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "CI build $GITHUB_RUN_NUMBER for $GITHUB_SHA ($JOB_STATUS)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-builds
